---
layout: default
---
<section class="wrap page">
  <header class="page__head">
    <h1>{{ page.title | escape }}</h1>
    {%- assign intro_len = page.intro | append: "" | size -%}
    {%- if intro_len > 0 %}<p class="lede">{{ page.intro | escape }}</p>{% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</section>
