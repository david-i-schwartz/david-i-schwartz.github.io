# Fetches Crossref metadata (title, authors, venue, pages) for every
# publication with a DOI and saves it to _tools/doi_metadata.json for review.
# It never edits publications.yml. Run it from the Actions tab
# ("Run workflow"); on a branch other than main it also commits the JSON.
name: Fetch DOI metadata

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch metadata from Crossref
        run: |
          python3 -m pip install --quiet --break-system-packages pyyaml
          python3 _tools/doi_metadata.py _data/cv/publications.yml _tools/doi_metadata.json
      - name: Commit the results (branches only)
        if: github.ref_name != 'main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _tools/doi_metadata.json
          git diff --cached --quiet || git commit -m "DOI metadata from Crossref"
          git push origin "HEAD:${GITHUB_REF_NAME}"
