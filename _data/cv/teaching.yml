course_development:
- institution: Rochester Institute of Technology
  course: IGME 689 (arcades)
  years: 2026–present
  description: 'Arcade Game design and development: many “game students” just don’t seem to choose game-adjacent course offerings. So, I’m leveraging my professional experience to run something that will help students transition away from their notions of games with something immediately adjacent.'
- institution: Rochester Institute of Technology
  course: IGME 309 (revisited)
  years: 2024–present
  description: In Fall 2024, I rewrote the course to remove OpenGL, which had been outdated for a long time, and replace it with OpenFrameworks. I submitted a new course proposal, which RIT approved in Spring 2025.
- institution: Rochester Institute of Technology
  course: IGME 599/799 (3D real-time workflow)
  years: '2024'
  description: In 2024, I plan to expand my game physics course and IGME 309 development into a 3D workflow via NVIDIA Omniverse. This work will extend ATLAS (bit.ly/programgames) and the 2023 project with MITRE and RIT Innovation Fellows.
- institution: Rochester Institute of Technology
  course: IGME 750
  years: '2024'
  description: Took over Graduate Game Engines when a faculty member was on medical leave. Working with two industry experts, we restructured the course to include more examples, new assignments, and weekly lecture topics.
- institution: Rochester Institute of Technology
  course: IGME 206
  years: '2022–2023'
  description: Defined a relatively new bridge course for graduate and transfer students. The course material combines classic CS1 and CS2 material in the context of game design and development.
- institution: Rochester Institute of Technology
  course: IGME 099 IGME 299
  years: '2014–2020'
  description: Developed and refined a co-op/career skills course for sophomores. The course involved collaborating with Career Services to explain how to create job-search materials. IGME-299 merged into IGME-099, which became the template for all GCCIS co-op prep classes and has helped thousands of students.
- institution: Rochester Institute of Technology
  course: IGME 590 IGME 790
  years: '2014–2019'
  description: “Game Physics/Physically based Animation” and related game development examples. See also bit.ly/programgames.
- institution: Rochester Institute of Technology
  course: IGME 695
  years: '2025'
  description: Rebuilt the course to include student engagement with guest speakers. IGM had not reviewed 695 since 2013.
- institution: Rochester Institute of Technology
  course: IGME 797 (graduate bridge)
  years: '2014–2018'
  description: Developed a new course to help incoming MS-GDD students develop C, C++, graphics, architecture, and game physics.
- institution: Rochester Institute of Technology
  course: Various courses
  years: '2010–2016'
  description: 'Semester conversion for undergraduate and graduate IGM courses: I played a crucial role in conversion planning (and eventually “fixing” as undergraduate program coordinator) for several IGM courses.'
- institution: Rochester Institute of Technology
  course: IGME 209 IGME 309
  years: '2011–2013 2024'
  description: 'Rewrote the entire “DSA” sequence: updated fixed-function material to the programmable pipeline via shaders, modern OpenGL, and C++. In 2024, I plan to redevelop 309 with OpenFrameworks to provide an “on ramp” to facilitate student success.'
- institution: Rochester Institute of Technology
  course: '4080-221 4080-222 4080-223'
  years: '2011–2012'
  description: Updated the entire introductory programming sequence (final year of the quarter system). Highlights include formalizing an “advanced” course for students with high CS-AP scores (which I handed off to other faculty after I joined administration) and rewriting all course projects, which created multiple portfolio items for my cohort of students.
- institution: Rochester Institute of Technology
  course: '4085-787 4085-788'
  years: '2010–2012'
  description: Updated and formalized the MS-GDD capstone policies, documents, and procedures. See Section 11 for a comprehensive list of supported graduate projects/theses.
- institution: Rochester Institute of Technology
  course: N/A
  years: '2009–2012'
  description: Developed courses on the ethics of sustainability using educational games based on economic game theory, funded by a Provost-awarded $22K grant. This work involved a multidisciplinary group of faculty and students from Sustainability, Philosophy, and IGM.
- institution: Rochester Institute of Technology
  course: N/A
  years: '2009–2010'
  description: Collaborated with the faculty of IGM and RIT’s Electrical Engineering Technology department to write a CCLI proposal for Physical Computing 2, a follow-up to IGM’s Physical Computing course.
- institution: Rochester Institute of Technology
  course: '4080-221 4080-222 4080-223'
  years: '2009–2010'
  description: Developed a compiler design project and introductory software engineering materials for this project-based development course. In Fall 2006, I also created a second game development project for the Game Boy Advance.
- institution: Rochester Institute of Technology
  course: '4002-590 4002-790'
  years: '2008–2009'
  description: Developed a course on alternative game interfaces in which students make custom game controllers.
- institution: Rochester Institute of Technology
  course: '4080-330'
  years: '2007–2008'
  description: Redesigned course; used by additional instructors.
- institution: Rochester Institute of Technology
  course: '4002-217 4002-218'
  years: '2007–2008'
  description: Revamped the course material, leveraging my Cornell introductory programming experience.
- institution: Cornell University
  course: CIS 300 CIS 400
  years: '2001–2007'
  description: My team and I developed two game design courses, CIS300 and CIS400, which comprise the core of Cornell’s Minor in Game Design. The minor is the first-ever undergraduate Ivy League program in game design. gdiac.cis.cornell.edu.
- institution: Cornell University
  course: CS 212
  years: '2002–2007'
  description: Developed a compiler design project and introductory software engineering materials for this project development course. In the Fall of 2006, I created a second game development project for the Game Boy Advance.
- institution: Cornell University
  course: CS 214 CS 215
  years: '2003–2007'
  description: Created two courses, Advanced UNIX (214) and Introduction to C# (215), and trained graduate students to administer them.
- institution: Cornell University
  course: CS 100M
  years: '2000–2004'
  description: Developed the Academic Excellence Workshop program for CS100M in collaboration with Cornell’s College of Engineering.
- institution: Cornell University
  course: CS 100M
  years: '2000'
  description: Developed course material for the first offering of CS100M, an introductory programming course that teaches programming with MATLAB and Java using scientific computing examples.
- institution: State University of New York at Buffalo
  course: EAS 140
  years: '1997–1998'
  description: Developed Unix and Maple laboratory modules for EAS 140, an introductory engineering course. These modules formed the basis for the two textbooks I published during graduate school, ultimately helping me make my “break” into Cornell.
