terminology_notes:
- 'Semesters: Calendar Year, F (Fall), and S (Spring) e.g., Spring 2015 and Fall 2016 S15 and F16'
- 'Quarters: Academic Year, 1 (Fall), 2 (Winter), 3 (Spring) e.g., 2007 Fall, Spring, Winter 071, 072, 073'
